<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Книга">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E3E6E2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Рабочий стол писателя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: writer's desk — grey-green desk surface, a single book sheet in the centre, table of contents as a side drawer, formatting bar pinned under the thumb. Single light "paper" theme by choice. */
:root{
  --desk:#E3E6E2; --desk-2:#D5DAD5; --paper:#FCFCF9; --ink:#23272C; --ink-2:#5C636A; --ink-3:#8B9298;
  --line:#D2D7D2; --accent:#2D4A78; --accent-soft:#E2E8F1; --danger:#9E3A31; --ok:#3F6B4E;
  --font-book:'Literata',Georgia,'Times New Roman',serif;
  --font-display:'Cormorant Garamond','Literata',Georgia,serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --side-w:300px; --bar-h:52px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--desk)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px)!important;z-index:30;transition:transform .22s ease;background:var(--desk);border-bottom:1px solid var(--desk-2);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:4px;height:52px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink);flex:none}
.ibtn:active{background:var(--desk-2)}
.top-title{flex:1;min-width:0;text-align:center;line-height:1.15}
.top-title small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top-title b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-dot{font-size:11px;color:var(--ink-3);min-width:0}

/* ---------- sidebar ---------- */
.side{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(86vw,var(--side-w));background:var(--paper);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);
  transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(20,30,40,.12)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(25,30,36,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.side-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);display:block;width:100%;text-align:left}
.side-head .all{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;color:var(--accent);font-weight:600}
.lib{display:flex;flex-direction:column;gap:8px}
.lib-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);width:100%}
.lib-row.cur{border-color:var(--accent);background:var(--accent-soft)}
.lib-go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.lib-cov{width:44px;aspect-ratio:125/200;flex:none;border-radius:2px;background:var(--accent) center/cover no-repeat;color:#F4F4EE;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;font-weight:600;box-shadow:1px 2px 5px rgba(0,0,0,.18)}
.lib-t{min-width:0}
.lib-t b{display:block;font-family:var(--font-book);font-size:15.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-t small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.lib-del{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-3);border-radius:10px;flex:none}
.lib-del .ico{width:18px;height:18px}
.book-name{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1;text-wrap:balance}
.book-author{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tab{padding:8px 2px;border-radius:9px;font-size:13px;color:var(--ink-2);text-align:center}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pane{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px}
.pane[hidden]{display:none}
.side-foot{padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.4}
.side-foot b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}

.toc-tools{display:flex;gap:6px;margin:2px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);background:var(--paper)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip .ico{width:16px;height:16px}
.toc{display:flex;flex-direction:column;gap:1px}
.toc-part{display:flex;align-items:center;gap:6px;padding:14px 8px 6px}
.toc-part .pl{flex:1;min-width:0}
.toc-part small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.toc-part span{display:block;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.15}
.toc-ch{display:flex;align-items:center;gap:6px;border-radius:10px}
.toc-ch.active{background:var(--accent-soft)}
.toc-ch .go{flex:1;min-width:0;display:grid;grid-template-columns:2.1em 1fr auto;align-items:baseline;gap:4px;padding:9px 8px;text-align:left}
.toc-ch .n{font-family:var(--font-book);color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:14px}
.toc-ch .t{font-family:var(--font-book);font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-ch .w{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc-ch.active .t{color:var(--accent);font-weight:600}
.row-ctl{display:flex;gap:0;flex:none}
.row-ctl button{width:32px;height:34px;display:grid;place-items:center;color:var(--ink-2);border-radius:8px}
.row-ctl button:active{background:var(--desk)}
.row-ctl .ico{width:18px;height:18px}
.row-ctl .del{color:var(--danger)}
.note{font-size:12.5px;line-height:1.45;color:var(--ink-2);background:var(--desk);border-radius:10px;padding:10px 12px;margin:12px 2px 0}

.search-box{position:relative;margin-bottom:8px}
.search-box input{width:100%;box-sizing:border-box;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:16px;color:var(--ink)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.hits{display:flex;flex-direction:column;gap:2px}
.hit{text-align:left;padding:10px 10px;border-radius:10px;display:block;width:100%}
.hit:active{background:var(--desk)}
.hit small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.hit span{font-family:var(--font-book);font-size:14px;line-height:1.45;color:var(--ink-2)}
.hit mark{background:#F3E2A6;color:var(--ink);border-radius:2px;padding:0 1px}
.muted{color:var(--ink-3);font-size:13px;padding:8px 4px;line-height:1.45}

.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.card:active{background:var(--desk)}
.ava{width:48px;height:48px;border-radius:50%;flex:none;background:var(--accent-soft) center/cover no-repeat;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--accent)}
.card-b{min-width:0;flex:1}
.card-b b{display:block;font-family:var(--font-book);font-size:15px;font-weight:600;line-height:1.25}
.card-b small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev-ch{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mini{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--desk);color:var(--ink-2)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border-radius:12px;border:1px dashed var(--ink-3);color:var(--ink-2);margin-top:4px;font-size:14px}
.add-btn .ico{width:18px;height:18px}

/* ---------- editor ---------- */
.top.hid{transform:translateY(-100%)}
main{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:71px calc(var(--bar-h) + 40px + env(safe-area-inset-bottom,0px))}
.sheet{max-width:600px;margin:0 auto;background:var(--paper);box-shadow:0 1px 2px rgba(30,40,50,.08),0 8px 30px rgba(30,40,50,.07);border-radius:3px;
  padding:13% 10.5% 16%;min-height:70vh;box-sizing:border-box;position:relative}
.sheet .part-line{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin-bottom:6px;font-family:var(--font-ui)}
.sheet .ch-label{font-family:var(--font-ui);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);text-align:center}
.ch-title{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,7.5vw,38px);line-height:1.08;text-align:center;margin:10px 0 0;text-wrap:balance;outline:none;min-height:1.1em}
.ch-title:empty::before{content:"Название главы";color:var(--ink-3)}
.orn{display:flex;justify-content:center;margin:18px 0 26px;color:var(--ink-3)}
.prose{font-family:var(--font-book);font-size:var(--fs,clamp(16px,4.3vw,18px));line-height:1.6;outline:none;text-align:justify;hyphens:auto;-webkit-hyphens:auto;min-height:40vh;caret-color:var(--accent);overflow-wrap:break-word}
.prose p{margin:0;text-indent:1.5em}
.prose > p:first-child,.prose h2 + p,.prose .scene + p,.prose figure + p{text-indent:0}
.prose h2{font-family:var(--font-book);font-size:.95em;font-weight:600;text-align:center;letter-spacing:.06em;margin:1.4em 0 .7em;text-indent:0}
.prose .scene{text-align:center;letter-spacing:.5em;margin:.9em 0;color:var(--ink-2);user-select:none;-webkit-user-select:none}
.prose figure{margin:1em 0;text-align:center}
.prose figure img{max-width:100%;max-height:60vh;border-radius:2px;display:block;margin:0 auto}
.prose figcaption{font-style:italic;font-size:.82em;color:var(--ink-2);margin-top:.4em;outline:none;text-align:center}
.prose figcaption:empty::before{content:"Подпись к картинке";color:var(--ink-3)}
.prose b,.prose strong{font-weight:600}
::highlight(hit){background:#F3D77A;color:var(--ink)}
.empty{max-width:420px;margin:12vh auto;text-align:center;color:var(--ink-2);font-family:var(--font-book);font-size:17px;line-height:1.5}
.empty .btn{margin-top:16px}

/* ---------- toolbar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bar-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bar.kb{padding-bottom:0;border-top:0;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(30,40,50,.08);transition:opacity .12s}
.bar.moving{opacity:0;pointer-events:none}
body.kb main{padding-bottom:45vh}
.bar-in{display:flex;justify-content:flex-start;gap:1px;height:var(--bar-h);align-items:center;max-width:600px;margin:0 auto;overflow-x:auto}
.tb{min-width:35px;height:40px;padding:0 5px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:var(--ink);flex:none}
.tb:active{background:var(--accent-soft);color:var(--accent)}
.tb.on{background:var(--accent);color:var(--on-accent)}
.tb.serif{font-family:var(--font-book)}
.tb .ico{width:20px;height:20px}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 2px;flex:none}
.bar-in > :first-child{margin-left:auto}.bar-in > :last-child{margin-right:auto}
.tb.dim{opacity:.35}
.bar:not(.kb) .tb[data-cmd="done"]{display:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(25,30,36,.36)}
.modal[hidden]{display:none!important}
.dlg{background:var(--paper);width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.15);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.modal{align-items:center}.dlg{border-radius:18px;padding-bottom:0}}
.dlg-h{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{flex:1;margin:0;font-family:var(--font-display);font-size:23px;font-weight:600}
.dlg-b{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dlg-f{display:flex;gap:8px;padding:12px 18px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld textarea,.fld select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);width:100%;box-sizing:border-box}
.fld textarea{min-height:84px;resize:vertical;font-family:var(--font-book);line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px}
.btn.ghost{background:var(--desk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);padding-inline:6px}
.btn .ico{width:18px;height:18px}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .ava{width:84px;height:84px;font-size:32px}
.photo-pick .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.link{color:var(--accent);font-size:14px;font-weight:600}
.link.red{color:var(--danger)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.checks input{width:16px;height:16px;accent-color:var(--accent)}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cover-row{display:flex;gap:12px}
.cover-slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cover-thumb{width:100%;aspect-ratio:125/200;max-width:100%;border-radius:4px;border:1px solid var(--line);background:var(--desk) center/cover no-repeat;display:grid;place-items:center;color:var(--ink-3);font-size:12px;text-align:center;padding:6px;box-sizing:border-box}
.fine{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 20px + env(safe-area-inset-bottom,0px));z-index:95;background:#23272C;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 40px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* ---------- preview ---------- */
.prev{position:fixed;inset:0;z-index:70;background:#CBD0CB;display:flex;flex-direction:column}
.prev[hidden]{display:none!important}
.prev-h{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--desk);border-bottom:1px solid var(--desk-2)}
.prev-h .info{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.prev-h .info b{display:block;font-size:15px;color:var(--ink)}
.prev-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:16px}
.pwrap{position:relative;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.14);background:#fff;overflow:hidden}
.pwrap .page{position:absolute;left:0;top:0;transform-origin:0 0}
.busy{position:fixed;inset:0;z-index:100;background:rgba(227,230,226,.94);display:grid;place-items:center;text-align:center;font-size:15px;color:var(--ink-2);padding:20px}
.busy b{display:block;font-family:var(--font-display);font-size:26px;color:var(--ink);margin-bottom:6px}
.busy[hidden]{display:none!important}
#measure{position:absolute;left:-12000px;top:0;visibility:hidden;pointer-events:none}
#pdfHost{position:fixed;left:0;top:0;z-index:90;pointer-events:none}

/* Book page (125 × 200 mm at 96 dpi = 472 × 756 px) */
.page{width:472px;height:756px;background:#fff;color:#1d2024;position:relative;overflow:hidden;font-family:var(--font-book);box-sizing:border-box}
.pbody{position:absolute;top:52px;width:382px;height:640px;font-size:13.4px;line-height:19.5px;text-align:justify;hyphens:manual;overflow:hidden}
.page.recto .pbody{left:52px}.page.verso .pbody{left:38px}
.pbody p{margin:0;text-indent:1.3em}
.pbody p.first,.pbody p.cont{text-indent:0}
.pbody p.head{text-align-last:justify}
.pbody h2{font-size:13.4px;font-weight:600;text-align:center;letter-spacing:.06em;margin:19.5px 0 9.75px;line-height:19.5px}
.pbody .scene{text-align:center;letter-spacing:.5em;margin:9.75px 0;line-height:19.5px}
.pbody figure{margin:9.75px 0;text-align:center}
.pbody figure img{max-width:100%;max-height:400px;display:block;margin:0 auto}
.pbody figcaption{font-style:italic;font-size:11.5px;line-height:15px;margin-top:5px;text-align:center}
.ch-open{padding-top:118px;text-align:center;margin-bottom:34px}
.ch-open .lab{font-family:var(--font-ui);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#2D4A78}
.ch-open .tit{font-family:var(--font-display);font-size:29px;font-weight:600;line-height:1.1;margin-top:10px;text-wrap:balance}
.ch-open .rule{width:36px;height:1px;background:#9aa0a6;margin:16px auto 0}
.rh{position:absolute;top:24px;left:52px;right:52px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;text-align:center;color:#6b7177;font-family:var(--font-book);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folio{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;color:#3d4247;font-variant-numeric:tabular-nums}
.page.cover{background:#2D4A78 center/cover no-repeat;color:#F4F4EE}
.cover-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.cover-txt .a{font-family:var(--font-ui);font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.85}
.cover-txt .t{font-family:var(--font-display);font-size:44px;font-weight:600;line-height:1.02;margin-top:18px;text-wrap:balance}
.cover-txt .r{width:44px;height:1px;background:currentColor;opacity:.6;margin:22px auto 0}
.back-txt{position:absolute;left:54px;right:54px;top:50%;transform:translateY(-50%);font-family:var(--font-book);font-size:13px;line-height:20px;text-align:center;white-space:pre-wrap}
.tp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:150px 50px 0}
.tp .a{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#4d535a;font-family:var(--font-ui)}
.tp .t{font-family:var(--font-display);font-size:36px;font-weight:600;line-height:1.05;margin-top:22px;text-wrap:balance}
.part-pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px}
.part-pg .l{font-family:var(--font-ui);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#2D4A78}
.part-pg .t{font-family:var(--font-display);font-size:32px;font-weight:600;margin-top:12px;line-height:1.1;text-wrap:balance}
.toc-h{font-family:var(--font-display);font-size:24px;font-weight:600;text-align:center;margin:40px 0 28px}
.toc-r{display:flex;align-items:baseline;gap:6px;line-height:19.5px;margin-bottom:4px;text-align:left}
.toc-r .tt{flex:0 1 auto}
.toc-r .dd{flex:1;border-bottom:1px dotted #8b9298;transform:translateY(-4px);min-width:12px}
.toc-r .nn{font-variant-numeric:tabular-nums;flex:none}
.toc-r.pt{margin-top:12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#2D4A78;font-family:var(--font-ui)}
.toc-r.ch{padding-left:14px}


/* ---------- writer tools ---------- */
.help-btn{display:flex;align-items:center;gap:6px;margin:0 16px;padding:8px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);width:calc(100% - 32px)}
.help-btn .ico{width:18px;height:18px;color:var(--accent)}
.help{display:flex;flex-direction:column;gap:6px}
.help details{border:1px solid var(--line);border-radius:12px;background:var(--field)}
.help summary{padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"+";color:var(--ink-3);font-weight:400}
.help details[open] summary::after{content:"–"}
.help .hb{padding:0 14px 12px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.help .hb p{margin:0 0 8px}.help .hb ul{margin:0 0 8px;padding-left:18px}.help .hb li{margin-bottom:4px}
.help .hb b{color:var(--ink)}
.help kbd{font-family:var(--font-book);display:inline-block;min-width:20px;text-align:center;padding:0 4px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}

#saveSt{margin-left:2px;letter-spacing:.04em}
#saveSt.saving{color:var(--ink-3)}#saveSt.saved{color:var(--ok)}#saveSt.err{color:var(--danger);font-weight:700}
.ch-foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-family:var(--font-ui)}
.ch-foot:empty{display:none}
.cf-stats{font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.cf-stats b{color:var(--ink);font-weight:600}
.goal-t{display:flex;justify-content:space-between;font-size:13px}
.goal-bar{height:6px;border-radius:3px;background:var(--desk);overflow:hidden;margin-top:4px}
.goal-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.goal-ok{font-size:12.5px;color:var(--ok);margin-top:4px}
.cf-lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.cf-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cf-seg button{padding:8px 4px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);background:var(--field)}
.cf-seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cf-note{font:inherit;font-family:var(--font-book);font-size:15px;line-height:1.45;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);resize:vertical;width:100%;box-sizing:border-box}
.cf-acts{display:flex;flex-wrap:wrap;gap:6px}
.toc-ch .tw{min-width:0;display:flex;flex-direction:column}
.toc-ch .nt{font-family:var(--font-ui);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.sdot.draft{background:#C79A3B}.sdot.edit{background:#B5543F}.sdot.done{background:var(--ok)}
.trash-link{margin:14px 2px 0;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.trash-link .ico{width:16px;height:16px}
.repl{margin:-2px 0 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#replBox{display:flex;gap:8px;width:100%}
#replBox input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);font:inherit;font-size:16px;color:var(--ink)}
#replBox .btn{padding:9px 12px;font-size:14px}
.prose .cmt{background:var(--note-bg);border-bottom:2px dotted var(--note-line);border-radius:2px;cursor:pointer}
.prose .cmt.flash{outline:2px solid var(--accent)}
.vers{display:flex;flex-direction:column;gap:10px}
.ver{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--field)}
.ver-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.ver-h span{font-size:12.5px;color:var(--ink-3)}
.ver-x{font-family:var(--font-book);font-size:13.5px;color:var(--ink-2);line-height:1.45}
.ver-a{display:flex;gap:16px}
.ver-full{font-family:var(--font-book);font-size:15px;line-height:1.55}.ver-full p{margin:0;text-indent:1.4em}.ver-full .scene{text-align:center}.ver-full img{max-width:100%}
.fs-row{display:flex;align-items:center;gap:10px}.fs-row input{flex:1;accent-color:var(--accent)}.fs-row b{font-variant-numeric:tabular-nums;font-size:14px;min-width:44px;text-align:right}
.nudge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom,0px));z-index:94;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:14px;padding:8px 6px 8px 14px;width:min(520px,calc(100% - 24px));box-sizing:border-box;font-size:14px}
.nudge span{flex:1;min-width:0}.nudge .btn{padding:8px 12px;font-size:14px;flex:none}.nudge .ibtn{flex:none;width:36px;height:36px}
.export-row{display:flex;gap:8px;flex-wrap:wrap}
/* focus mode */
.focus-exit{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));z-index:45;width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);place-items:center;opacity:.7}
body.focus .focus-exit{display:grid}
body.focus .top{display:none}
body.focus .sheet{box-shadow:none;background:transparent}
html.focus,html.focus body{background:var(--paper)}
html.focus body::before{background:var(--paper)}
body.focus .part-line,body.focus .orn,body.focus .ch-foot{display:none}
body.focus .side,body.focus .scrim{display:none}
@media (min-width:960px){body.focus main{margin-left:0}body.focus .bar{left:0}}
/* night theme */
:root{--field:#fff;--bar-bg:rgba(252,252,249,.96);--on-accent:#fff;--note-bg:#FBF0C9;--note-line:#C9A23B}
:root[data-night]{color-scheme:dark;--desk:#161819;--desk-2:#222527;--paper:#1F2224;--ink:#E3E0D8;--ink-2:#AAAEB2;--ink-3:#7C8287;--line:#33383B;--accent:#93ADD8;--accent-soft:#26303F;--danger:#E0897F;--ok:#8BC29C;--field:#191B1D;--bar-bg:rgba(31,34,36,.96);--on-accent:#111417;--note-bg:#3A3320;--note-line:#B8963A}
:root[data-night] body::before{background:var(--desk)}
:root[data-night] .sheet{box-shadow:0 1px 2px rgba(0,0,0,.4)}
:root[data-night] .hit mark,:root[data-night] ::highlight(hit){background:#5A4A1C;color:var(--ink)}
@media (min-width:960px){
  .side{transform:none;box-shadow:none}
  .scrim{display:none}
  main{margin-left:var(--side-w)}
  .top{left:var(--side-w)}
  .bar{left:var(--side-w)}
  #menuBtn{display:none}
}
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="ibtn" id="menuBtn" aria-label="Оглавление"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="top-title"><small><span id="topSmall">Книга</span><span id="saveSt"></span></small><b id="topTitle">—</b></div>

    <button class="ibtn" id="focusBtn" aria-label="Режим без отвлечений"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
    <button class="ibtn" id="prevBtn" aria-label="Вёрстка и PDF"><svg class="ico" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5c-3.5-.5-6.5 0-8.5 1.5Z"/><path d="M12 6.5v13"/></svg></button>
    <button class="ibtn" id="bookBtn" aria-label="Книга и обложки"><svg class="ico" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></button>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Боковая панель">
  <button class="side-head" id="sideHead" aria-label="Все книги"><div class="book-name" id="sideTitle"></div><div class="book-author" id="sideAuthor"></div><span class="all">Все книги ›</span></button>
  <button class="help-btn" id="helpBtn" type="button" aria-label="Как пользоваться"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/></svg>Как пользоваться</button>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="toc" aria-selected="true">Главы</button>
    <button class="tab" role="tab" data-tab="find" aria-selected="false">Поиск</button>
    <button class="tab" role="tab" data-tab="chars" aria-selected="false">Герои</button>
    <button class="tab" role="tab" data-tab="events" aria-selected="false">События</button>
  </div>
  <div class="pane" id="pane-toc">
    <div class="toc-tools">
      <button class="chip" id="addCh"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Глава</button>
      <button class="chip" id="addPart"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Часть</button>
      <button class="chip" id="editToc"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>Порядок</button>
    </div>
    <div class="toc" id="toc"></div>
    <div id="sampleNote"></div>
  </div>
  <div class="pane" id="pane-find" hidden>
    <div class="search-box"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="Пара слов из текста" autocomplete="off" enterkeyhint="search"></div>
    <div class="repl"><button class="chip" id="replToggle" type="button">Заменить…</button><div id="replBox" hidden><input id="rq" type="text" placeholder="На что заменить" autocomplete="off"><button class="btn" id="replGo" type="button">Заменить все</button></div></div>
    <div class="hits" id="hits"><div class="muted">Введите хотя бы две буквы. Ищу во всех главах, в заголовках и подписях к картинкам. Буквы «е» и «ё» считаются одинаковыми.</div></div>
  </div>
  <div class="pane" id="pane-chars" hidden><div class="cards" id="chars"></div></div>
  <div class="pane" id="pane-events" hidden><div class="cards" id="events"></div></div>
  <div class="side-foot"><b id="totWords">0</b> слов · <b id="totPages">≈0</b> стр.<span id="todayLine"></span><br><span id="backupLine">Текст хранится только на этом устройстве.</span></div>
</aside>

<main id="main">
  <article class="sheet" id="sheet">
    <div class="part-line" id="partLine"></div>
    <div class="ch-label" id="chLabel">Глава 1</div>
    <h1 class="ch-title" id="chTitle" spellcheck="true"></h1>
    <div class="orn" aria-hidden="true"><svg width="54" height="10" viewBox="0 0 54 10"><path d="M0 5h20M34 5h20" stroke="currentColor" stroke-width="1"/><path d="M27 1.5 30.5 5 27 8.5 23.5 5Z" fill="currentColor"/></svg></div>
    <div class="prose" id="prose" contenteditable="true" lang="ru" spellcheck="true"></div>
    <div class="ch-foot" id="chFoot"></div>
  </article>
  <button class="focus-exit" id="focusExit" aria-label="Выйти из режима без отвлечений"><svg class="ico" viewBox="0 0 24 24"><path d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg></button>
  <div class="empty" id="empty" hidden>В книге пока нет глав.<br><button class="btn" id="emptyAdd">Начать первую главу</button></div>
</main>

<nav class="bar" id="bar" aria-label="Оформление текста">
  <div class="bar-in">
    <button class="tb" data-cmd="undo" title="Отменить" aria-label="Отменить"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="tb" data-cmd="redo" title="Повторить" aria-label="Повторить"><svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="tb-sep"></span>
    <button class="tb serif" data-cmd="p" title="Обычный абзац" aria-label="Обычный абзац">¶</button>
    <button class="tb serif" data-cmd="h2" title="Подзаголовок" aria-label="Подзаголовок" style="font-weight:600">Заг</button>
    <button class="tb serif" data-cmd="scene" title="Разрыв сцены" aria-label="Разрыв сцены" style="font-size:19px">⁂</button>
    <span class="tb-sep"></span>
    <button class="tb serif" data-cmd="bold" title="Жирный" aria-label="Жирный" style="font-weight:700">Ж</button>
    <button class="tb serif" data-cmd="italic" title="Курсив" aria-label="Курсив" style="font-style:italic">К</button>
    <button class="tb" data-cmd="note" title="Заметка на полях" aria-label="Заметка на полях"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4.5h14v11H10l-5 4v-15Z"/><path d="M9 9h6M9 12h4"/></svg></button>
    <button class="tb" data-cmd="img" title="Вставить картинку" aria-label="Вставить картинку"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg></button>
    <button class="tb" data-cmd="done" title="Скрыть клавиатуру" aria-label="Скрыть клавиатуру"><svg class="ico" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
  </div>
</nav>

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true">
  <div class="dlg-h"><h3 id="mTitle"></h3><button class="ibtn" id="mClose" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="dlg-b" id="mBody"></div>
  <div class="dlg-f" id="mFoot"></div>
</div></div>

<section class="prev" id="prev" hidden>
  <div class="prev-h">
    <button class="ibtn" id="prevClose" aria-label="Назад к тексту"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="info"><b>Вёрстка книги</b><span id="prevInfo">125 × 200 мм</span></div>
    <button class="btn" id="pdfBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>PDF</button>
  </div>
  <div class="prev-b" id="prevBody"></div>
</section>

<div class="busy" id="busy" hidden><div><b id="busyT">Верстаю книгу</b><span id="busyS"></span></div></div>
<div id="measure"></div>
<div id="pdfHost"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
document.documentElement.lang='ru';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const ICON={
 up:'<svg class="ico" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg>',
 down:'<svg class="ico" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg>',
 edit:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>',
 del:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
 plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};
const ORD=['первая','вторая','третья','четвёртая','пятая','шестая','седьмая','восьмая','девятая','десятая','одиннадцатая','двенадцатая'];

/* ---------- storage: IndexedDB on this device ---------- */
const Store={db:null,mode:'idb',mem:{},
 async open(){
  try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('kniga-pisatelya',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej('timeout'),4000);});}
  catch(e){try{localStorage.setItem('kp:t','1');localStorage.removeItem('kp:t');this.mode='ls';}catch(_){this.mode='mem';}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
 },
 tx(m){return this.db.transaction('kv',m).objectStore('kv');},
 async get(k){
  if(this.mode==='idb')return new Promise(res=>{try{const r=this.tx('readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined);}catch(e){res(undefined)}});
  if(this.mode==='ls'){try{const v=localStorage.getItem('kp:'+k);return v?JSON.parse(v):undefined}catch(e){return undefined}}
  return this.mem[k];
 },
 async set(k,v){
  if(this.mode==='idb')return new Promise(res=>{try{const r=this.tx('readwrite').put(v,k);r.onsuccess=()=>res(true);r.onerror=()=>res(false);}catch(e){res(false)}});

 },
 async del(k){

/* ---------- text helpers ---------- */
const BLOCKS=new Set(['P','H1','H2','H3','DIV','FIGURE','FIGCAPTION','LI','BLOCKQUOTE']);
function textMap(root){let text='';const map=[];
 (function walk(n){for(const c of n.childNodes){
  if(c.nodeType===3){map.push([c,text.length]);text+=c.nodeValue;}
  else if(c.nodeType===1){if(c.tagName==='BR'){text+='\n';continue;}if(c.tagName==='IMG')continue;
   const b=BLOCKS.has(c.tagName);if(b&&text&&!text.endsWith('\n'))text+='\n';walk(c);if(b&&!text.endsWith('\n'))text+='\n';}
 }})(root);return{text,map};}
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
function parse(h){const d=document.createElement('div');d.innerHTML=h||'';return d;}
function countWords(h){const t=textMap(parse(h)).text;const m=t.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu);return m?m.length:0;}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

let imgCb=null;
function pickImage(max,cb){imgCb={max,cb};const f=$('#fileImg');f.value='';f.click();}
$('#fileImg').addEventListener('change',async e=>{const file=e.target.files[0];if(!file||!imgCb)return;const {max,cb}=imgCb;imgCb=null;
 try{cb(await shrink(file,max));}catch(err){toast('Не получилось открыть картинку. Попробуйте JPEG или PNG.');}});
function shrink(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.86));};
 im.onerror=()=>{URL.revokeObjectURL(url);rej();};im.src=url;});}

function runSearch(){
 const q=norm($('#q').value.trim());const box=$('#hits');box.textContent='';
 if(q.length<2){box.append(el('div',{class:'muted',text:'Введите хотя бы две буквы. Ищу во всех главах, в заголовках и подписях к картинкам. Буквы «е» и «ё» считаются одинаковыми.'}));return;}
 let total=0;
 for(const c of chapters()){
  const raw=(c.id===cur?textMap(prose).text:textMap(parse(html[c.id])).text);const t=norm(raw);
  if(norm(c.title||'').includes(q)&&total<300){total++;box.append(el('button',{class:'hit',onclick:()=>openChapter(c.id)},el('small',{text:'Глава '+chNum(c.id)+' · название'}),el('span',{html:mark(c.title,q)})));}
  let i=t.indexOf(q),occ=0;
  while(i>=0&&total<300){
   const a=Math.max(0,i-48),b=Math.min(raw.length,i+q.length+60);
   const snip=(a>0?'…':'')+esc(raw.slice(a,i))+'<mark>'+esc(raw.slice(i,i+q.length))+'</mark>'+esc(raw.slice(i+q.length,b))+(b<raw.length?'…':'');
   const o=occ;box.append(el('button',{class:'hit',onclick:()=>openChapter(c.id,{find:{q,occ:o}})},el('small',{text:'Глава '+chNum(c.id)+(c.title?' · '+c.title:'')}),el('span',{html:snip.replace(/\n/g,' ')})));
   total++;occ++;i=t.indexOf(q,i+q.length);
  }
 }
 if(!total)box.append(el('div',{class:'muted',text:'Ничего не нашлось. Попробуйте одно слово или его начало.'}));
 else if(total>=300)box.append(el('div',{class:'muted',text:'Показаны первые 300 совпадений. Уточните запрос.'}));
}
function mark(s,q){const n=norm(s);const i=n.indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}

let hitTimer=null;

function highlightOcc(q,occ){
 const {text,map}=textMap(prose);const t=norm(text);let i=-1;for(let k=0;k<=occ;k++){i=t.indexOf(q,i+(k?q.length:0));if(i<0)return;}
 const loc=pos=>{for(let k=map.length-1;k>=0;k--){if(map[k][1]<=pos)return[map[k][0],pos-map[k][1]];}return null;};
 const s=loc(i),e=loc(i+q.length);if(!s||!e)return;
 const r=document.createRange();try{r.setStart(s[0],Math.min(s[1],s[0].length));r.setEnd(e[0],Math.min(e[1],e[0].length));}catch(err){return;}
 const rect=r.getBoundingClientRect();window.scrollTo({top:window.scrollY+rect.top-window.innerHeight*.35,behavior:'smooth'});
 try{if(window.CSS&&CSS.highlights&&window.Highlight){CSS.highlights.set('hit',new Highlight(r));clearTimeout(hitTimer);hitTimer=setTimeout(clearHit,6000);return;}}catch(err){}
 const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
}

/* ---------- book layout (pagination) ---------- */
const PW=472,PH=756,CH=640,LH=19.5;
let laid=null;
function newPage(kind){const p=el('div',{class:'page '+(kind||''),lang:'ru'});const b=el('div',{class:'pbody'});p.append(b);p._b=b;return p;}
function fits(b){return b.scrollHeight<=CH+0.5;}
function textLen(n){return n.textContent.length;}
function slice(src,start,end){
 const c=src.cloneNode(true);let pos=0;const tn=[];
 (function w(n){for(const k of [...n.childNodes]){if(k.nodeType===3)tn.push(k);else if(k.nodeType===1){if(k.tagName==='BR'){k.remove();continue;}w(k);}}})(c);
 for(const t of tn){const s=pos,e=pos+t.nodeValue.length;pos=e;
  if(e<=start||s>=end)t.nodeValue='';else t.nodeValue=t.nodeValue.slice(Math.max(0,start-s),Math.min(t.nodeValue.length,end-s));}
 c.querySelectorAll('b,i,em,strong,span,u').forEach(x=>{if(!x.textContent)x.remove();});
 return c;
}
function prepBlocks(h){
 const out=[];const src=parse(h);
 for(const n of [...src.childNodes]){
  if(n.nodeType===3){if(n.nodeValue.trim())out.push(el('p',null,n.nodeValue));continue;}
  if(n.nodeType!==1)continue;
  if(n.classList.contains('scene')){out.push(el('div',{class:'scene',text:'* * *'}));continue;}
  if(n.tagName==='FIGURE'){const im=n.querySelector('img');if(!im)continue;const cap=n.querySelector('figcaption');const f=el('figure',null,el('img',{src:im.getAttribute('src'),alt:''}));if(cap&&cap.textContent.trim())f.append(el('figcaption',{text:cap.textContent.trim()}));out.push(f);continue;}
  if(/^H[1-6]$/.test(n.tagName)){if(n.textContent.trim())out.push(el('h2',{text:n.textContent.trim()}));continue;}
  if(!n.textContent.trim())continue;
  const p=document.createElement('p');p.innerHTML=n.innerHTML;p.querySelectorAll('br').forEach(b=>b.remove());p.querySelectorAll('.cmt').forEach(c=>{while(c.firstChild)c.parentNode.insertBefore(c.firstChild,c);c.remove();});out.push(p);
 }
 let prev=null;for(const b of out){if(b.tagName==='P'&&(!prev||prev.tagName!=='P'))b.classList.add('first');prev=b;}
 return out;
}
async function layoutBook(onStep){
 await (document.fonts&&document.fonts.ready);
 const host=$('#measure');host.textContent='';
 const content=[];let pg=null,curCh=null;const starts={};
 const push=kind=>{pg=newPage(kind);pg._ch=curCh;host.append(pg);content.push(pg);return pg;};
 const tick=async()=>{if(content.length%8===0){onStep&&onStep(content.length);await new Promise(r=>setTimeout(r,0));}};
 async function add(block){
  const b=pg._b;
  if(block.tagName==='FIGURE'){const im=block.querySelector('img');b.append(block);try{await im.decode();}catch(e){}if(fits(b))return;block.remove();if(b.childNodes.length){push('text');pg._b.append(block);}else b.append(block);return;}
  b.append(block);
  if(block.tagName==='H2'){if(b.scrollHeight+LH*2<=CH+0.5)return;block.remove();if(b.childNodes.length)push('text');pg._b.append(block);return;}
  if(fits(b))return;block.remove();
  if(block.tagName!=='P'){if(b.childNodes.length)push('text');pg._b.append(block);return;}
  const text=block.textContent,cuts=[];const re=/\s+/g;let m;while((m=re.exec(text)))cuts.push(m.index+m[0].length);
  let lo=0,hi=cuts.length-1,best=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;const h=slice(block,0,cuts[mid]);b.append(h);const ok=fits(b);h.remove();if(ok){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<0){if(b.childNodes.length){push('text');await add(block);}else b.append(block);return;}
  const head=slice(block,0,cuts[best]);head.classList.add('head');b.append(head);
  const rest=slice(block,cuts[best],text.length);rest.classList.remove('first','head');rest.classList.add('cont');
  push('text');await add(rest);
 }
 for(const it of book.items){
  if(it.t==='part'){curCh=null;const p=push('part');p._noFolio=true;p.append(el('div',{class:'part-pg'},el('div',{class:'l',text:partLabel(partNo(it.id))}),it.title?el('div',{class:'t',text:it.title}):null));starts[it.id]=content.length-1;continue;}
  curCh=it;const p=push('text open');p._open=true;starts[it.id]=content.length-1;
  p._b.append(el('div',{class:'ch-open'},el('div',{class:'lab',text:'Глава '+chNum(it.id)}),it.title?el('div',{class:'tit',text:it.title}):null,el('div',{class:'rule'})));
  const blocks=prepBlocks(it.id===cur?prose.innerHTML:html[it.id]);
  for(const bl of blocks){await add(bl);await tick();}
 }
 // contents pages
 const tocRows=n=>book.items.map(it=>{const num=n?String(n[it.id]):'000';
  return it.t==='part'?el('div',{class:'toc-r pt'},el('span',{class:'tt',text:partLabel(partNo(it.id))+(it.title?'. '+it.title:'')}),el('span',{class:'dd'}),el('span',{class:'nn',text:num}))
   :el('div',{class:'toc-r'+(partOf(it.id)?' ch':'')},el('span',{class:'tt',text:chNum(it.id)+'. '+(it.title||'Без названия')}),el('span',{class:'dd'}),el('span',{class:'nn',text:num}));});
 const buildToc=n=>{const pages=[];let p=newPage('toc');host.append(p);pages.push(p);p._b.append(el('div',{class:'toc-h',text:'Содержание'}));
  for(const r of tocRows(n)){p._b.append(r);if(!fits(p._b)){r.remove();p=newPage('toc');host.append(p);pages.push(p);p._b.append(r);}}return pages;};
 const tocCount=book.items.length?buildToc(null).length:0;
 // numbering: title page is 1, contents follow, then text
 const firstNum=2+tocCount;const nums={};
 for(const id in starts)nums[id]=firstNum+starts[id];
 host.textContent='';content.forEach(p=>host.append(p));
 const tocPages=book.items.length?buildToc(nums):[];
 // front cover
 const front=el('div',{class:'page cover',lang:'ru'});
 if(book.front)front.style.backgroundImage='url("'+book.front+'")';
 else front.append(el('div',{class:'cover-txt'},book.author?el('div',{class:'a',text:book.author}):null,el('div',{class:'t',text:book.title||'Без названия'}),el('div',{class:'r'})));
 const title=el('div',{class:'page',lang:'ru'},el('div',{class:'tp'},book.author?el('div',{class:'a',text:book.author}):null,el('div',{class:'t',text:book.title||'Без названия'})));
 const back=el('div',{class:'page cover',lang:'ru'});
 if(book.back)back.style.backgroundImage='url("'+book.back+'")';else if(book.backText&&book.backText.trim())back.append(el('div',{class:'back-txt',text:book.backText.trim()}));
 // folios, running heads, recto/verso
 const all=[front,title,...tocPages,...content,back];
 all.forEach((p,i)=>{const n=i;p.classList.remove('recto','verso');p.classList.add(n%2?'recto':'verso');
  if(i<=1||i===all.length-1)return;
  const isText=content.includes(p);
  if(isText&&!p._noFolio)p.append(el('div',{class:'folio',text:String(n)}));
  if(isText&&!p._open&&!p._noFolio){p.append(el('div',{class:'rh',text:n%2?(p._ch&&p._ch.title?p._ch.title:'Глава '+(p._ch?chNum(p._ch.id):'')):(book.title||'')}));}
  if(!isText)p.append(el('div',{class:'folio',text:String(n)}));
 });
 host.textContent='';
 return all;
}

/* ---------- keyboard-aware toolbar ---------- */
const bar=$('#bar');
// With the keyboard open the bar sits at the TOP of the visible area. iOS itself keeps
// the caret just above the keyboard, so the bar never covers the line being typed and we
// never fight the user's scrolling. While the page scrolls the bar hides, then returns.
let kbOpen=false,scrollT=null;
function editing(){const a=document.activeElement;return !!a&&(a===prose||prose.contains(a)||a===titleEl);}
function placeBar(){
 const vv=window.visualViewport;if(!vv)return;
 const kb=(window.innerHeight-vv.height)>120&&editing();
 if(kb!==kbOpen){kbOpen=kb;document.body.classList.toggle('kb',kb);bar.classList.toggle('kb',kb);if(typeof topEl!=='undefined')topEl.classList.toggle('hid',kb&&window.scrollY>60);}
 if(kb){bar.style.top=Math.max(0,Math.round(vv.offsetTop))+'px';bar.style.bottom='auto';}
 else{bar.style.top='';bar.style.bottom='';}
}
function caretRect(){
 const sel=getSelection();if(!sel.rangeCount)return null;
 const node=sel.anchorNode;if(!node||!(prose.contains(node)||titleEl.contains(node)))return null;
 const r=sel.getRangeAt(0).cloneRange();r.collapse(false);
 let rect=r.getClientRects()[0]||r.getBoundingClientRect();
 if(!rect||(rect.top===0&&rect.bottom===0)){const b=(node.nodeType===1?node:node.parentElement);const br=b?b.getBoundingClientRect():null;rect=br?{top:br.top,bottom:Math.min(br.bottom,br.top+30)}:null;}
 return rect;
}
// Only called after a toolbar button: bring the caret back into view if it was scrolled away.
function revealCaret(){
 const vv=window.visualViewport;const r=caretRect();if(!r)return;
 const top=(vv?vv.offsetTop:0)+(kbOpen?bar.offsetHeight:0)+10;
 const bottom=(vv?vv.offsetTop+vv.height:innerHeight)-(kbOpen?10:bar.offsetHeight+10);
 if(r.top<top||r.bottom>bottom){const target=top+(bottom-top)*0.45;window.scrollBy(0,Math.round(r.top-target));setTimeout(placeBar,50);}
}
// Header: hidden while the keyboard is open or while scrolling down through the text;
// any upward swipe (keyboard closed) or reaching the top brings it back.
const topEl=document.querySelector('.top');let lastY=window.scrollY;
function updTop(){
 const y=window.scrollY,dy=y-lastY;lastY=y;
 if(kbOpen){topEl.classList.add('hid');return;}
 if(y<60||dy<-6)topEl.classList.remove('hid');
 else if(dy>6)topEl.classList.add('hid');
}
addEventListener('scroll',updTop,{passive:true});
function onScrollMove(){
 if(!kbOpen){placeBar();return;}
 bar.classList.add('moving');clearTimeout(scrollT);
 scrollT=setTimeout(()=>{placeBar();bar.classList.remove('moving');},160);
}
if(window.visualViewport){
 const vv=window.visualViewport;
 vv.addEventListener('resize',onScrollMove);
 vv.addEventListener('scroll',onScrollMove);
}
addEventListener('scroll',onScrollMove,{passive:true});
for(const t of [prose,titleEl]){
 t.addEventListener('focus',()=>{setTimeout(placeBar,300);setTimeout(placeBar,700);});
 t.addEventListener('blur',()=>setTimeout(placeBar,80));
}

const DAY=864e5;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function humanDay(d){const t=todayStr();if(d===t)return'Сегодня';const y=new Date(Date.now()-DAY);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');if(d===ys)return'Вчера';const [Y,M,D]=d.split('-').map(Number);return D+' '+MONTHS_G[M-1]+(Y!==new Date().getFullYear()?' '+Y:'');}

/* ---------- undo / redo (own history, per chapter) ---------- */
const hist={stack:[],pos:-1};let histApplying=false;
function caretOffset(){const sel=getSelection();if(!sel.rangeCount||!prose.contains(sel.anchorNode))return null;try{const r=document.createRange();r.selectNodeContents(prose);r.setEnd(sel.anchorNode,sel.anchorOffset);return r.toString().length;}catch(e){return null;}}
function setCaretOffset(off){
 if(off==null)return;const w=document.createTreeWalker(prose,NodeFilter.SHOW_TEXT);let n,acc=0,last=null;
 while((n=w.nextNode())){const L=n.nodeValue.length;if(acc+L>=off){placeAt(n,off-acc);return;}acc+=L;last=n;}
 if(last)placeAt(last,last.nodeValue.length);
 function placeAt(node,o){try{const r=document.createRange();r.setStart(node,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
}
function histReset(){hist.stack=[{h:prose.innerHTML,c:null}];hist.pos=0;updUndo();}
function histRecord(){
 if(histApplying)return;clearTimeout(timers.__hist);delete timers.__hist;
 const h=prose.innerHTML;if(hist.stack[hist.pos]&&hist.stack[hist.pos].h===h)return;
 hist.stack=hist.stack.slice(0,hist.pos+1);hist.stack.push({h,c:caretOffset()});
 if(hist.stack.length>300)hist.stack.shift();hist.pos=hist.stack.length-1;updUndo();
}
function histSchedule(){if(histApplying)return;clearTimeout(timers.__hist);timers.__hist=setTimeout(()=>{delete timers.__hist;histRecord();},650);updUndo(true);}
function histApply(i){
 histApplying=true;const st=hist.stack[i];hist.pos=i;
 prose.innerHTML=st.h;ensureBlocks();html[cur]=prose.innerHTML;wc[cur]=countWords(html[cur]);saveCh(cur);
 prose.focus({preventScroll:true});setCaretOffset(st.c!=null?st.c:(hist.stack[i+1]&&hist.stack[i+1].c));
 histApplying=false;updUndo();renderFoot();setTimeout(revealCaret,30);
}
function undo(){if(timers.__hist)histRecord();if(hist.pos>0)histApply(hist.pos-1);else toast('Отменять больше нечего');}
function redo(){if(hist.pos<hist.stack.length-1)histApply(hist.pos+1);else toast('Повторять нечего');}
function updUndo(pending){const u=document.querySelector('.tb[data-cmd="undo"]'),r=document.querySelector('.tb[data-cmd="redo"]');if(!u)return;
 u.classList.toggle('dim',!(pending||hist.pos>0));r.classList.toggle('dim',!(hist.pos<hist.stack.length-1));}

/* ---------- versions (daily snapshots per chapter) ---------- */
const snapCache={};
async function getSnaps(id){if(!snapCache[id])snapCache[id]=(await Store.get('snap:'+id))||[];return snapCache[id];}
async function snapSave(id,h,label){
 const arr=await getSnaps(id);const d=todayStr();const last=arr[arr.length-1];const w=countWords(h);
 if(!label&&last&&last.d===d&&!last.label){if(last.h===h)return;last.h=h;last.t=new Date().toISOString();last.w=w;}
 else{if(!label&&last&&last.h===h)return;arr.push({d,t:new Date().toISOString(),h,w,label:label||null});}
 while(arr.length>12)arr.shift();
 await Store.set('snap:'+id,arr);
}
async function openVersions(){

/* ---------- typography while typing ---------- */
function typo(e){
 if(histApplying||!e||e.inputType!=='insertText'||!e.data)return;
 const sel=getSelection();if(!sel.rangeCount||!sel.isCollapsed)return;
 const node=sel.anchorNode;if(!node||node.nodeType!==3||!prose.contains(node))return;
 const off=sel.anchorOffset;const v=node.nodeValue;const before=v.slice(0,off);
 const blk=blockOf(node);let lineStart='';
 if(blk){try{const r=document.createRange();r.selectNodeContents(blk);r.setEnd(node,off);lineStart=r.toString();}catch(_){}}
 let rep=null;// [chars to remove before caret, text to insert]
 const ch=e.data.slice(-1);
 if(/["“”„«»]/.test(ch)&&before.endsWith(ch)){
  const p=before.slice(0,-1).slice(-1);const open=!p||/[\s(\[—–\-\u00A0«]/.test(p);rep=[1,open?'«':'»'];
 }else if(ch==='.'&&before.endsWith('...')){rep=[3,'…'];}
 else if(ch==='-'&&before.endsWith('--')){rep=[2,'—'];}
 else if(ch===' '&&/^[-–—]\s$/.test(lineStart)){rep=[2,'—\u00A0'];}
 else if(ch===' '&&/[^\s][ \u00A0][-–][ \u00A0]$/.test(before)){rep=[3,'\u00A0—'+before.slice(-1)];}
 if(!rep)return;
 node.nodeValue=v.slice(0,off-rep[0])+rep[1]+v.slice(off);
 const pos=off-rep[0]+rep[1].length;const r=document.createRange();r.setStart(node,pos);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
 onProse();
}

/* ---------- find & replace ---------- */
function rxFor(q){const s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,m=>m===m.toUpperCase()?'[ЕЁ]':'[её]');return new RegExp(s,'gi');}
function matchCase(found,rep){if(!rep)return rep;const f=found[0];if(f&&f!==f.toLowerCase()&&rep[0]===rep[0].toLowerCase())return rep[0].toUpperCase()+rep.slice(1);return rep;}
function replaceInHtml(h,q,rep){
 const d=parse(h);let n=0;const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);const nodes=[];let x;while((x=w.nextNode()))nodes.push(x);
 for(const t of nodes){if(t.parentElement&&t.parentElement.closest('.scene'))continue;const re=rxFor(q);const nv=t.nodeValue.replace(re,m=>{n++;return matchCase(m,rep);});if(nv!==t.nodeValue)t.nodeValue=nv;}
 return{h:d.innerHTML,n};
}
function countAll(q){let n=0;const re=rxFor(q);for(const c of chapters()){const src=c.id===cur?prose.innerHTML:html[c.id];const t=textMap(parse(src)).text;n+=(t.match(re)||[]).length;n+=((c.title||'').match(rxFor(q))||[]).length;}return n;}

  const r=replaceInHtml(html[c.id],q,rep);const tr=(c.title||'').replace(rxFor(q),m=>matchCase(m,rep));
  if(r.n||tr!==(c.title||'')){await snapSave(c.id,html[c.id],'до замены «'+q+'»');html[c.id]=r.h;wc[c.id]=countWords(r.h);await Store.set('ch:'+c.id,r.h);await snapSave(c.id,r.h);c.title=tr;changed++;}
 }

const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function xesc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cleanChapterNodes(h){
 const d=parse(h);d.querySelectorAll('.cmt').forEach(s=>{const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);s.remove();});
 d.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
 const out=[];
 for(const n of [...d.childNodes]){
  if(n.nodeType===3){if(n.nodeValue.trim())out.push({k:'p',node:el('p',null,n.nodeValue)});continue;}
  if(n.nodeType!==1)continue;
  if(n.classList.contains('scene')){out.push({k:'scene'});continue;}
  if(n.tagName==='FIGURE'){const im=n.querySelector('img');if(im)out.push({k:'img',src:im.getAttribute('src'),cap:(n.querySelector('figcaption')||{}).textContent||''});continue;}
  if(/^H[1-6]$/.test(n.tagName)){if(n.textContent.trim())out.push({k:'h2',text:n.textContent.trim()});continue;}
  if(!n.textContent.trim())continue;out.push({k:'p',node:n});
 }
 return out;
}
function dataUrlBytes(u){const b=atob(u.split(',')[1]||'');const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

function runs(node,fmt){
 // collect inline runs [{t,b,i}] from a paragraph node
 const out=[];(function w(n,b,i){for(const c of n.childNodes){if(c.nodeType===3){if(c.nodeValue)out.push({t:c.nodeValue,b,i});}else if(c.nodeType===1){if(c.tagName==='BR'){out.push({br:1});continue;}const tb=b||/^(B|STRONG)$/.test(c.tagName),ti=i||/^(I|EM)$/.test(c.tagName);w(c,tb,ti);}}})(node,false,false);
 return out;
}

 ['Как писать и оформлять','<p>Нижняя панель:</p><ul><li><kbd>↶</kbd> <kbd>↷</kbd> отменить и повторить.</li><li><kbd>¶</kbd> обычный абзац, <kbd>Заг</kbd> подзаголовок, <kbd>⁂</kbd> разрыв сцены.</li><li><kbd>Ж</kbd> жирный, <kbd>К</kbd> курсив. Кнопка горит, когда оформление включено.</li><li>Облачко ставит <b>заметку на полях</b>: выделите фразу и нажмите его. Заметка подсветится жёлтым, нажатие на неё открывает текст. В PDF, Word и EPUB заметки не попадают.</li><li>Картинка вставляет фото из галереи, подпись пишется под ним.</li><li><kbd>✓</kbd> прячет клавиатуру.</li></ul><p>Пока открыта клавиатура, панель стоит вверху экрана. Если вы ушли листанием далеко от курсора, любая кнопка панели вернёт к нему.</p><p>При наборе приложение само ставит <b>тире</b> («- » в начале абзаца и « - » между словами), <b>«ёлочки»</b> вместо прямых кавычек и <b>«…»</b> вместо трёх точек.</p>'],
 ['Верхняя панель и поиск','<p>Верхняя панель прячется, когда вы листаете текст вниз или пишете, и появляется, если чуть потянуть текст вверх.</p><ul><li><b>Название вверху</b> открывает список всех книг.</li><li><b>Лупа</b> ищет пару слов по всей книге, «е» и «ё» считаются одинаковыми. Нажмите на результат, и откроется нужное место.</li><li><b>Заменить…</b> под строкой поиска меняет слово во всей книге, например имя героя. Перед заменой сохраняется версия каждой главы.</li><li><b>Рамка</b> включает режим без отвлечений, выход значком в правом верхнем углу.</li><li><b>Книжка</b> показывает вёрстку и сохраняет PDF.</li><li><b>⋯</b> открывает название, обложки, экспорт, копии и настройки.</li></ul>'],
 ['Под текстом главы','<p>Пролистайте главу до конца:</p><ul><li>сколько слов в главе и сколько написано сегодня, <b>цель на день</b>;</li><li><b>статус</b>: черновик, правка или готово;</li><li><b>заметка к главе</b>: о чём она и что доделать, в книгу не попадает;</li><li><b>Версии</b>: состояние главы по дням, любую версию можно посмотреть и вернуть;</li><li><b>Разделить главу</b> в месте курсора и <b>Объединить со следующей</b>.</li></ul>'],
 ['Герои и события','<p>В оглавлении есть вкладки <b>Герои</b> и <b>События</b>.</p><ul><li>Герой: фото, имя, возраст, внешность и характер.</li><li>Событие: название, описание, глава и участники. События идут в порядке глав.</li></ul>'],
 ['Несколько книг и корзина','<ul><li>Нажмите название вверху или название книги в оглавлении: откроется <b>Все книги</b>. Там переключение между книгами и кнопка <b>Новая книга</b>.</li><li>Удалённые главы и книги 30 дней лежат в <b>корзине</b>: корзина глав внизу оглавления, корзина книг внизу списка «Все книги».</li></ul>'],
 ['Где хранится текст и копии','<ul><li>Всё хранится <b>только на этом телефоне</b>, на сервер ничего не уходит. Работает и без интернета.</li><li>Приложение с иконки и сайт в Safari хранят книги <b>отдельно</b>. Пишите в одном месте.</li><li>Вверху рядом с номером главы видно <b>«сохранено»</b>.</li><li>Раз в неделю делайте <b>копию</b>: ⋯ → Сохранить копию, файл ляжет в «Файлы». Если копии давно не было, приложение напомнит.</li><li><b>Загрузить копию</b> добавляет книгу из файла в список, ничего не заменяя. Так книгу можно перенести на другой телефон.</li></ul>'],
 ['PDF, Word и EPUB','<ul><li><b>Книжка</b> вверху показывает книгу по страницам 125 × 200 мм с обложками, содержанием и номерами страниц. Кнопка PDF сохраняет файл.</li><li>⋯ → <b>Word</b> для редактора или издательства, <b>EPUB</b> для электронных читалок.</li><li>Обложки и аннотация задаются в ⋯.</li></ul>'],
 ['Внешний вид','<ul><li>⋯ → <b>Размер текста</b> в редакторе.</li><li>Тема: <b>светлая, ночная</b> или <b>как в телефоне</b>.</li><li><b>Режим без отвлечений</b> прячет всё, кроме текста.</li></ul>']
];
function openHelp(){
 const box=el('div',{class:'help'});
 HELP.forEach(([t,h],i)=>{const d=el('details',i===0?{open:true}:null,el('summary',{text:t}),el('div',{class:'hb',html:h}));box.append(d);});
 closeDrawer();openModal('Как пользоваться',[box],[{label:'Понятно',primary:true,fn:closeModal}]);
}
$('#helpBtn').onclick=openHelp;

$('#focusBtn').onclick=()=>toggleFocus(true);
$('#focusExit').onclick=()=>toggleFocus(false);
$('#replToggle').onclick=()=>{const b=$('#replBox');b.hidden=!b.hidden;if(!b.hidden)setTimeout(()=>$('#rq').focus(),50);};
$('#replGo').onclick=replaceAll;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&!e.altKey&&e.key.toLowerCase()==='z'&&document.activeElement===prose){e.preventDefault();e.shiftKey?redo():undo();}});
if(getPref('focus','0')==='1'){document.body.classList.add('focus');document.documentElement.classList.add('focus');}

load().then(async()=>{await purgeOldTrash();renderAll();renderFoot();setTimeout(maybeNudgeBackup,2500);if(getPref('helpSeen','0')!=='1'){setPref('helpSeen','1');setTimeout(()=>nudge('Короткая инструкция по приложению всегда есть в ☰ и в меню ⋯.','Открыть',openHelp),1200);}});
})();
</script>

<script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.ready.then(async()=>{
    try{const c=await caches.open('kniga-v9');if(!(await c.match('index.html')))return;
      if(localStorage.getItem('kp:offline')==='2')return;localStorage.setItem('kp:offline','2');}catch(e){return;}
    const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');
    d.textContent='Готово: теперь приложение открывается и без интернета';document.body.append(d);setTimeout(()=>d.remove(),4500);
  }).catch(()=>{});
}
</script>
