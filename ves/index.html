<meta name="mobile-web-app-capable" content="yes">

<style>
/* Warm journal: cream paper, peach accent, one big progress ring toward the reward; three sections in a bottom bar. Single light look by choice. */
:root{
  --bg:#FBF3EC; --card:#FFFBF7; --ink:#3A2A24; --ink-2:#7A655C; --ink-3:#AD9A91; --line:#EEDFD4;
  --peach:#E9805E; --peach-2:#F4B79C; --peach-soft:#FCE5D9; --sage:#7FA488; --sage-soft:#E3EFE5; --water:#5B9CC4; --water-soft:#E1EEF6; --gold:#D6A245;
  --f-head:'Lora',Georgia,serif; --f-ui:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --tab-h:60px; color-scheme:light; padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:620px;margin:0 auto}
header.top{padding-block:14px 6px;display:flex;align-items:center;gap:10px}
header.top h1{flex:1;margin:0;font-family:var(--f-head);font-weight:600;font-size:28px;line-height:1.1}
.gear{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.gear:active{background:var(--peach-soft)}
main{padding-bottom:calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;background:var(--peach);color:#fff;font-weight:800;font-size:16px}
.btn:active{filter:brightness(.95)}
.btn.ghost{background:var(--peach-soft);color:#B5543A}
.btn.plain{background:transparent;color:var(--ink-2);font-weight:700;padding-inline:8px}
.btn.danger{background:transparent;color:#C0503A;padding-inline:4px}
.btn.wide{width:100%}
.btn .ico{width:20px;height:20px}

/* goal / ring */
.goal{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:13px;color:var(--ink-2);margin-top:4px}
.gstats{display:flex;flex-direction:column;gap:10px}
.gstat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.gstat span{font-size:13px;color:var(--ink-2)}
.gstat.ok b{color:var(--sage)}
.reward{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF3E3,#FCE5D9);border:1px solid #F3D3BF;border-radius:20px;padding:14px}
.reward .pic{width:86px;height:70px;flex:none;border-radius:12px;background:#fff center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.reward .pic svg{width:80px;height:64px}
.reward b{display:block;font-family:var(--f-head);font-size:18px;font-weight:600;line-height:1.2}
.reward p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.reward .bar{height:8px;border-radius:4px;background:#fff;margin-top:8px;overflow:hidden}
.reward .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach-2),var(--peach));border-radius:4px}
.nudge{display:flex;gap:12px;align-items:center;background:var(--sage-soft);border-radius:16px;padding:12px 14px;font-size:15px}
.nudge.due{background:var(--peach-soft)}
.nudge span{flex:1}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font:11px var(--f-ui);fill:var(--ink-3)}
.chart .goalline{stroke:var(--sage);stroke-dasharray:4 4;stroke-width:1.5}
.chart .goaltxt{fill:var(--sage);font-weight:700}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .d{flex:1;min-width:0}
.row .d b{display:block;font-weight:700}
.row .d span{font-size:13px;color:var(--ink-3)}
.row .w{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:800;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.chg.down{background:var(--sage-soft);color:#4E7A5A}.chg.up{background:#FBE2DC;color:#B5543A}.chg.same{background:#F3ECE6;color:var(--ink-2)}

/* day (food & water) */
.daynav{display:flex;align-items:center;gap:8px}
.daynav button.ar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.daynav button.ar:disabled{opacity:.35}
.daynav .t{flex:1;text-align:center}
.daynav .t b{display:block;font-family:var(--f-head);font-size:21px;font-weight:600}
.daynav .t span{font-size:13px;color:var(--ink-3)}
.water-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.water-top b{font-size:26px;font-weight:800;color:var(--water);font-variant-numeric:tabular-nums}
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin:12px 0}
.gl{aspect-ratio:3/4;border-radius:6px 6px 10px 10px;border:2px solid #BFD8E8;background:#fff;position:relative;overflow:hidden}
.gl.on{border-color:var(--water)}
.gl.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:linear-gradient(#8FC0DD,var(--water))}
.wbtns{display:flex;gap:8px}
.wbtns .btn{flex:1}
.btn.water{background:var(--water);color:#fff}
.btn.water-ghost{background:var(--water-soft);color:#3E7BA2}
textarea.free{width:100%;min-height:180px;resize:vertical;font:inherit;font-size:16px;line-height:1.55;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.saved{font-size:12.5px;color:var(--ink-3);text-align:right;margin-top:6px;min-height:1.2em}
.hist-day{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hist-day:last-child{border-bottom:0}
.hist-day .x{min-width:0;flex:1}
.hist-day .x b{display:block;font-weight:700}
.hist-day .x span{display:block;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-day .wv{font-size:13px;color:var(--water);font-weight:800;white-space:nowrap}

/* workouts */
.wk-sum{display:flex;gap:10px}
.wk-sum .card{flex:1;padding:12px 14px}
.wk-sum b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.wk-sum span{font-size:13px;color:var(--ink-2)}
.week-dots{display:flex;gap:6px;margin-top:8px}
.week-dots i{flex:1;height:30px;border-radius:8px;background:#F3ECE6;display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--ink-3);font-weight:700}
.week-dots i.on{background:var(--sage);color:#fff}
.week-dots i.today{outline:2px solid var(--ink-3);outline-offset:1px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%}
.entry .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--ink-2);padding:30px 16px;font-size:15px;line-height:1.5}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,251,247,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h);max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--peach)}

/* sheet */
.modal{position:fixed;inset:0;z-index:60;background:rgba(58,42,36,.35);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
@media (min-width:700px){.modal{align-items:center}.dlg{border-radius:24px}}
.dlg h3{margin:0;font-family:var(--f-head);font-weight:600;font-size:23px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fld input,.fld textarea{font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
.fld textarea{min-height:150px;resize:vertical;line-height:1.5}
.big-num{display:flex;align-items:center;gap:10px;justify-content:center}
.big-num input{width:150px;text-align:center;font-size:36px;font-weight:800;padding:10px;border-radius:16px;border:2px solid var(--peach-2);background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.big-num span{font-size:20px;color:var(--ink-2);font-weight:700}
.step{width:48px;height:48px;border-radius:50%;background:var(--peach-soft);color:#B5543A;font-size:24px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:15px;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.party{text-align:center;padding:8px 0}
.party .big{font-size:56px;line-height:1}
.party h3{margin-top:8px}
.welcome{text-align:center;display:flex;flex-direction:column;gap:12px;padding-top:4vh}
.welcome h2{margin:0;font-family:var(--f-head);font-weight:600;font-size:30px;line-height:1.15}
.welcome p{margin:0;color:var(--ink-2)}
.pic-pick{display:flex;gap:12px;align-items:center}
.pic-pick .pic{width:86px;height:70px;border-radius:12px;background:#fff center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.pic-pick .pic svg{width:80px;height:64px}
.link{color:#B5543A;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="title">Вес</h1><button class="gear" id="setBtn" aria-label="Настройки"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></header>

</div></nav>
<input type="file" id="fileImg" accept="image/*" hidden>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');

const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MSH=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

function human(s){const t=today();if(s===t)return'Сегодня';if(s===addDays(t,-1))return'Вчера';const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
const kg=v=>(Math.round(v*10)/10).toLocaleString('ru-RU',{minimumFractionDigits:v%1?1:0,maximumFractionDigits:1});
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:NaN;};

/* ---------- storage (this phone only) ---------- */
const KEY='k65:data';
let D=null;
function load(){try{D=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){D=null;}
 D=D||{};D.goal=D.goal||65;D.reward=D.reward||'iPad 11 с чехлом-клавиатурой и стилусом';D.weights=D.weights||[];D.workouts=D.workouts||[];D.days=D.days||{};D.glass=D.glass||250;D.waterGoal=D.waterGoal||2000;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true;}catch(e){toast('Не удалось сохранить: память переполнена. Уберите фото награды или сохраните копию.');return false;}}

/* ---------- reward picture (original drawing of a tablet with keyboard and stylus) ---------- */
const TABLET='<svg viewBox="0 0 80 64" aria-hidden="true"><rect x="10" y="6" width="56" height="38" rx="4" fill="#3A2A24"/><rect x="13" y="9" width="50" height="32" rx="2" fill="#F4B79C"/><circle cx="38" cy="25" r="6" fill="#FFFBF7" opacity=".85"/><path d="M6 46h64l4 10H2Z" fill="#7A655C"/><path d="M10 49h56M9 52h58" stroke="#AD9A91" stroke-width="1.2"/><rect x="68" y="8" width="3" height="34" rx="1.5" fill="#E9805E" transform="rotate(12 69 25)"/></svg>';

/* ---------- views ---------- */
let view='weight';
function setView(v){view=v;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.v===v)));['weight','sport','food'].forEach(x=>$('#v-'+x).hidden=x!==v);
 $('#title').textContent={weight:'Вес',sport:'Тренировки',food:'Еда и вода'}[v];render();window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
function render(){if(view==='weight')renderWeight();else if(view==='sport')renderSport();else renderFood();}

/* ---------- weight ---------- */
const sortedW=()=>[...D.weights].sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
function renderWeight(){
 const box=$('#v-weight');box.textContent='';
 if(D.start==null){box.append(el('div',{class:'welcome'},el('div',{class:'reward',style:'justify-content:center'},el('div',{class:'pic',html:TABLET}),el('div',{style:'text-align:left'},el('b',{text:'Цель: '+kg(D.goal)+' кг'}),el('p',{text:'Награда: '+D.reward}))),
  el('h2',{text:'Начнём путь к '+kg(D.goal)+' кг'}),el('p',{text:'Введите вес на старте. Потом раз в неделю отмечайте новый вес, и здесь будет видно, сколько уже сброшено и сколько осталось до награды.'}),
  el('button',{class:'btn wide',text:'Ввести стартовый вес',onclick:startSetup})));return;}
 const W=sortedW();const cur=W.length?W[W.length-1].w:D.start;
 const total=D.start-D.goal;const lost=D.start-cur;const left=cur-D.goal;
 const pct=total>0?Math.max(0,Math.min(1,lost/total)):0;const reached=cur<=D.goal;
 // ring
 const R=62,C=2*Math.PI*R;
 const ring=el('div',{class:'ring',html:`<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="#F3E3D8" stroke-width="13"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="url(#gr)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B79C"/><stop offset="1" stop-color="#E9805E"/></linearGradient></defs></svg>`},
  el('div',{class:'c'},el('b',{text:kg(cur)}),el('span',{text:'кг сейчас'})));
 box.append(el('div',{class:'card goal'},ring,el('div',{class:'gstats'},
  el('div',{class:'gstat ok'},el('b',{text:(lost>=0?'−':'+')+kg(Math.abs(lost))+' кг'}),el('span',{text:lost>=0?'уже сброшено со старта':'больше, чем на старте'})),
  el('div',{class:'gstat'},el('b',{text:reached?'Цель достигнута!':kg(left)+' кг'}),el('span',{text:reached?'награда заслужена':'осталось до '+kg(D.goal)+' кг'})),
  el('div',{class:'gstat'},el('b',{text:Math.round(pct*100)+'%'}),el('span',{text:'пути пройдено'})))));
 // reward
 const pic=el('div',{class:'pic'});if(D.rewardPic)pic.style.backgroundImage='url("'+D.rewardPic+'")';else pic.innerHTML=TABLET;
